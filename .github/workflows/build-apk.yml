name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk TVLibre.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVLibre-apk
          path: TVLibre.apk

      - name: Publier une Release (lien de téléchargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TV Libre v1.0.${{ github.run_number }}
          body: Télécharge TVLibre.apk ci-dessous et installe-le sur ton téléphone Android.
          files: TVLibre.apk
